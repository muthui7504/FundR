services:
  - type: web
    name: fundraise-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run db:generate && npm run db:migrate
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MPESA_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PLATFORM_DARAJA_CALLBACK_URL
        value: https://fundraise-api-pni1.onrender.com
