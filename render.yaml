services:
  - type: web
    name: fundraise-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run db:generate && npm run db:migrate
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MPESA_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
